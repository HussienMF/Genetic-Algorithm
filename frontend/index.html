  <script>
    let currentLang = 'ar'; // default

    function toggleLang() {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      document.querySelector('html').setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');

      // Update all elements with data-ar/data-en
      document.querySelectorAll('[data-ar]').forEach(el => {
        if (currentLang === 'ar') {
          el.innerHTML = el.getAttribute('data-ar');
        } else {
          el.innerHTML = el.getAttribute('data-en');
        }
      });
    }
      toggleLang();
  </script>
